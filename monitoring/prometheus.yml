# Prometheus scrape configuration for FlowFirst (sample - copy, then replace the <...> placeholders).
#
# FlowFirst processes serve /metrics on METRICS_PORT_BASE + N (default 9101..9105) when METRICS_ENABLED=true.
# They are NOT behind HAProxy: scrape every node. Remote Worker (Process 5) exists on Node 4 only.
# With TLS_API_ENABLED=true the listeners need a client certificate signed by the FlowFirst CA; issue one for
# Prometheus (security/issue_cert.sh) and point tls_config at it. Check rules with: promtool check rules monitoring/*.rules.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager: install with monitoring/setup_alertmanager.sh (on one node or a dedicated monitoring host).
# Replace <alertmanager-ip> with the node's IP. Port 9093 must be reachable from this Prometheus.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["<alertmanager-ip>:9093"]

rule_files:
  - flowfirst.rules.yml
  - infrastructure.rules.yml

scrape_configs:
  - job_name: flowfirst
    scheme: https                          # use http when TLS_API_ENABLED=false
    tls_config:
      ca_file: /etc/prometheus/flowfirst/ca.crt
      cert_file: /etc/prometheus/flowfirst/prometheus.crt
      key_file: /etc/prometheus/flowfirst/prometheus.key
      server_name: <name or IP in the node's -api certificate>   # the listener presents <node>-api
    static_configs:
      - targets: ["<node1-ip>:9101", "<node1-ip>:9102", "<node1-ip>:9103", "<node1-ip>:9104"]
        labels: {node_group: cluster}
      - targets: ["<node2-ip>:9101", "<node2-ip>:9102", "<node2-ip>:9103", "<node2-ip>:9104"]
        labels: {node_group: cluster}
      - targets: ["<node3-ip>:9101", "<node3-ip>:9102", "<node3-ip>:9103", "<node3-ip>:9104"]
        labels: {node_group: cluster}
      - targets: ["<node4-ip>:9105"]
        labels: {node_group: remote}

  # --- Infrastructure (separate exporters; NOT shipped with FlowFirst). Rules in infrastructure.rules.yml use these job names.
  - job_name: rabbitmq                     # built in: rabbitmq-plugins enable rabbitmq_prometheus  (port 15692)
    static_configs:                        # plain /metrics: node health and the resource alarms
      - targets: ["<node1-ip>:15692", "<node2-ip>:15692", "<node3-ip>:15692"]

  - job_name: rabbitmq_queues              # per-queue depth and consumer count (not on the plain endpoint)
    metrics_path: /metrics/detailed
    params: {family: [queue_coarse_metrics, queue_consumer_count]}
    static_configs:
      - targets: ["<node1-ip>:15692", "<node2-ip>:15692", "<node3-ip>:15692"]

  - job_name: mysqld                       # prometheus/mysqld_exporter on each Galera node. Its default port 9104 is
    static_configs:                        # DB Updater (Process 4)'s metrics port, so run it with --web.listen-address=:9114
      - targets: ["<node1-ip>:9114", "<node2-ip>:9114", "<node3-ip>:9114"]

  - job_name: node                         # prometheus/node_exporter on every node
    static_configs:
      - targets: ["<node1-ip>:9100", "<node2-ip>:9100", "<node3-ip>:9100", "<node4-ip>:9100"]
