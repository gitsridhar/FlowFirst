# Lint gate = rules that find real bugs only: syntax errors (E9), undefined names (F821/F822/F823),
# redefinitions (F811), invalid comparisons/format strings (F5xx errors, F63x, F7xx).
# Style rules (unused imports F401, f-strings without placeholders F541, unused variables F841) are deliberately
# NOT enforced: some imports have side effects (e.g. eventlet), and a gate should not fail on taste.
target-version = "py39"

[lint]
select = ["E9", "F63", "F7", "F82", "F811", "F50", "F52", "F601", "F602"]
