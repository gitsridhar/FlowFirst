# FlowFirst - systemd sandbox shared by all five process units.
# Installed by systemd/install_services.sh as /etc/systemd/system/flowfirst-process<N>.service.d/10-hardening.conf
# (a drop-in, so there is ONE copy of these settings). To relax one setting on one node, add your own drop-in that
# sorts later, e.g. /etc/systemd/system/flowfirst-process1.service.d/99-local.conf containing
#     [Service]
#     MemoryDenyWriteExecute=false
# then `sudo systemctl daemon-reload` and restart the unit. Inspect the result with:
#     systemd-analyze security flowfirst-process1.service
#
# What the processes legitimately do: read /opt/flowfirst and /etc/flowfirst/tls, write /var/log/flowfirst
# (LogsDirectory=), open outgoing TCP to RabbitMQ / MariaDB / ZooKeeper / Swift, and process 1 also listens on one TCP
# port. Nothing else, so everything else is closed.

[Service]
# --- file system ---------------------------------------------------------------------------------------------------
# The whole file system is read-only for the process, except /var/log/flowfirst (LogsDirectory=) and a private /tmp.
# If you set LOG_DIR in .env to another directory, also add: ReadWritePaths=/that/directory (in a 99-local.conf).
ProtectSystem=strict
# /home, /root and /run/user are invisible. install_services.sh switches this to read-only if the application directory
# itself is under /home or /root.
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
# Other users' processes are not visible in /proc.
ProtectProc=invisible
ProcSubset=pid
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true

# --- privileges ----------------------------------------------------------------------------------------------------
NoNewPrivileges=true
# Port 8082 is above 1024, so no capability is needed at all.
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
# Refuses memory that is writable and executable at once (a common exploit technique). Python, eventlet, greenlet,
# pika, kazoo, pymysql and OpenSSL do not need it. If a future library does, relax it in a 99-local.conf.
MemoryDenyWriteExecute=true
RemoveIPC=true
# Log files and anything else the process creates are not readable by other users.
UMask=0027

# --- network -------------------------------------------------------------------------------------------------------
# TCP/UDP over IPv4/IPv6 (RabbitMQ, MariaDB, ZooKeeper, Swift, DNS) and local sockets (name-service lookups).
# Raw sockets, packet capture and netlink are refused.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# --- system calls --------------------------------------------------------------------------------------------------
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
